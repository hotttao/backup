[project]
name = "bili-sync"
version = "0.1.0"
description = "Incremental local archiver for a Bilibili video collection"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.0",
]

[project.scripts]
bili-sync = "bili_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_sync"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

